<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svg/snap.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1
    maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>SnapFix - Get experts for repair & services instantly</title>

    <meta
      name="description"
      content="Snapfix connects customers with trusted workers for all home services. Book instantly, track work in real-time, pay securely, and enjoy a smooth experience from start to finish."
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://trysnapfix.in" />

    <!-- Open Graph (for Google + WhatsApp / Social SEO) -->
    <meta
      property="og:title"
      content="SnapFix - Quick bookings for home services"
    />
    <meta
      property="og:description"
      content="Get trusted workers instantly. Track jobs, chat, pay online or COD. Fast and simple."
    />
    <meta property="og:url" content="https://trysnapfix.in" />
    <meta
      property="og:image"
      content="https://trysnapfix.in/images/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Keywords (optional but helpful for new sites) -->
    <meta
      name="keywords"
      content="SnapFix, home services, booking app, repair workers, plumber, electrician, trysnapfix"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
